<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" role="img" aria-labelledby="logo-title-f logo-desc-f">
  <title id="logo-title-f">BinZ</title>
  <desc id="logo-desc-f">BinZ footer logo — for dark backgrounds.</desc>

  <defs>
    <style>
      .fw  { fill: #f0faf6; }
      .ft  { fill: #2ec4b6; }
      .fg  { fill: #6ee09a; }
      .s-fw  { stroke: #f0faf6; fill: none; }
      .s-ft  { stroke: #2ec4b6; fill: none; }
    </style>
  </defs>

  <!-- B -->
  <text x="2" y="84"
    class="fw"
    font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif"
    font-size="88" font-weight="900" letter-spacing="-2">B</text>
  <!-- i -->
  <text x="64" y="84"
    class="ft"
    font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif"
    font-size="88" font-weight="900" letter-spacing="-2">i</text>
  <!-- N -->
  <text x="88" y="84"
    class="fw"
    font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif"
    font-size="88" font-weight="900" letter-spacing="-2">N</text>

  <!-- Recycling symbol -->
  <text x="164" y="54"
    class="ft"
    font-family="'Segoe UI Symbol','Apple Color Emoji','Noto Color Emoji',sans-serif"
    font-size="52"
    text-anchor="middle">♻</text>

  <!-- Bin icon -->
  <g transform="translate(192, 8)">
    <rect class="fg" x="34" y="0" width="34" height="9" rx="4.5"/>
    <rect class="fw" x="2" y="13" width="110" height="9" rx="4.5"/>
    <path class="ft" d="M 8 26 H 108 L 96 98 H 20 Z"/>
    <line class="s-fw" x1="90" y1="32" x2="28" y2="90" stroke-width="12" stroke-linecap="round"/>
    <line class="s-fw" x1="110" y1="48" x2="64" y2="90" stroke-width="12" stroke-linecap="round"/>
    <path class="s-fw" d="M 8 26 H 108 L 96 98 H 20 Z" stroke-width="5" stroke-linejoin="round"/>
  </g>

</svg>
