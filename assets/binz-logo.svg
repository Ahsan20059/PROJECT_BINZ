<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">BinZ</title>
  <desc id="logo-desc">BinZ logo in a white rounded capsule.</desc>

  <defs>
    <filter id="logo-shadow" x="-8%" y="-18%" width="116%" height="136%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0b7c77" flood-opacity="0.18"/>
    </filter>
    <style>
      .navy  { fill: #143d5c; }
      .teal  { fill: #0b7c77; }
      .green { fill: #4caf6e; }
      .white { fill: #ffffff; }
      .s-navy  { stroke: #143d5c; fill: none; }
      .s-white { stroke: #ffffff; fill: none; }
    </style>
  </defs>

  <rect x="5" y="16" width="270" height="78" rx="18" class="white" filter="url(#logo-shadow)"/>

  <g transform="translate(64 21) scale(0.46)">
    <path class="navy" d="M29 8 L41 1 L54 8 L47 19 L39 14 L31 27 L18 26 Z"/>
    <path class="teal" d="M54 13 L66 22 L67 38 L54 38 L53 28 L40 28 L47 18 Z"/>
    <path class="green" d="M31 55 L18 47 L13 32 L24 25 L29 36 L42 36 L34 47 Z"/>
    <circle class="green" cx="41" cy="29" r="6"/>
  </g>

  <g transform="translate(45 49)">
    <text x="0" y="34" class="navy" font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif" font-size="48" font-weight="900" letter-spacing="-4">B</text>
    <text x="36" y="34" class="teal" font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif" font-size="48" font-weight="900" letter-spacing="-4">i</text>
    <text x="53" y="34" class="navy" font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif" font-size="48" font-weight="900" letter-spacing="-4">N</text>
  </g>

  <g transform="translate(133 34)">
    <rect class="green" x="31" y="0" width="30" height="7" rx="3.5"/>
    <rect class="navy" x="4" y="13" width="88" height="7" rx="3.5"/>
    <path class="teal" d="M 9 24 H 88 L 78 72 H 18 Z"/>
    <line class="s-white" x1="72" y1="28" x2="26" y2="68" stroke-width="8" stroke-linecap="round"/>
    <line class="s-white" x1="90" y1="39" x2="56" y2="68" stroke-width="8" stroke-linecap="round"/>
    <path class="s-navy" d="M 9 24 H 88 L 78 72 H 18 Z" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
